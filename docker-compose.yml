services:
  backend:
    build:
      context: ./backend
    container_name: sprachlern-backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - sprachlern-net

  frontend:
    build:
      context: ./frontend
    container_name: sprachlern-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sprachlern-net

networks:
  sprachlern-net:
    driver: bridge